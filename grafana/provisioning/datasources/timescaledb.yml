apiVersion: 1

datasources:
  - name: Onbalans TimescaleDB
    type: postgres
    access: proxy
    url: timescaledb:5432
    database: onbalans
    user: onbalans
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
    isDefault: true
    editable: true