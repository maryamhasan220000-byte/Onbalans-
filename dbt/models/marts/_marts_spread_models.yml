version: 2

models:
  - name: fct_imbalance_spread
    description: >
      Every 12-second TenneT grid measurement matched to the ENTSO-E
      day-ahead price fixed for the 15-minute block containing it.

      spread_eur_mwh = what balancing actually cost minus what the market
      expected it to cost the previous afternoon. It is the price of being
      wrong, and it is the reason both pipelines exist.

      GRAIN: one row per TenneT measurement. The join is a range join, not
      an equality join, because the two clocks never coincide: TenneT ticks
      every 12 seconds and ENTSO-E prices cover 15-minute blocks. Each
      measurement falls inside exactly one block, so the grain is unchanged.

      900 seconds / 12 seconds = exactly 75 measurements per block, with no
      remainder. assert_spread_75_measurements_per_block enforces this.

      INNER JOIN is deliberate. A measurement with no covering price is
      dropped rather than kept with a null price, so a gap in the ENTSO-E
      backfill shows up as missing rows that
      assert_spread_row_count_matches_grid catches loudly.

      CAVEAT: TenneT Balance Delta is operational snapshot data. TenneT
      states the Settlement Prices publication is leading for settlement,
      so these spreads describe operational grid state, not settled amounts.
    columns:
      - name: interval_start
        description: "TenneT measurement start, UTC. Grain of this table."
        tests: 
          - unique
          - not_null

      - name: price_period_start
        description: >
          Start of the price block this measurement was matched to. Kept so
          the join is auditable from the output rather than taken on faith.
        tests: 
          - not_null

      - name: price_period_end
        description: "End of the matched price block."
        tests: 
          - not_null

      - name: day_ahead_price_eur_mwh
        description: >
          What the market expected this period to cost. Negative values are
          real and expected during solar surplus.
        tests: 
          - not_null

      - name: imbalance_mid_price_eur_mwh
        description: "What balancing actually cost TenneT in real time."

      - name: spread_eur_mwh
        description: >
          imbalance_mid_price_eur_mwh - day_ahead_price_eur_mwh.
          Positive: balancing cost MORE than forecast.
          Negative: balancing cost LESS than forecast.
          Null only when either input price is null.

      - name: abs_spread_eur_mwh
        description: >
          Magnitude regardless of direction. Signed spreads cancel when
          averaged, so an hour swinging +200 then -200 would look calm.
          Use this to measure how wrong the forecast was.

      - name: spread_direction
        description: "Which side of the forecast reality landed on."
        tests:
          - accepted_values:
              arguments:
                values: ['above_forecast', 'below_forecast', 'at_forecast']

      - name: has_imputed_input
        description: >
          True when either side of the spread is not directly observed: the
          price was forward-filled from a position ENTSO-E omitted, or a
          TenneT volume component failed to parse. Filter on NOT this to
          restrict to fully observed rows.
        tests:
          - not_null

      - name: day_ahead_ramp_eur_mwh
        description: >
          Price change from the previous 15-minute block. The hypothesis
          this mart exists to test: steep ramps are when forecasts fail.