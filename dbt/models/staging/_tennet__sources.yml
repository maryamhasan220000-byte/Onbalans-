version: 2

sources:
  - name: tennet
    schema: raw
    description: "Loader output. Text as TenneT sent it."

    tables:
      - name: balance_delta
        config:
          loaded_at_field: interval_start

          freshness:
            warn_after:
              count: 2
              period: hour

            error_after:
              count: 6
              period: hour

        columns:
          - name: interval_start
            tests:
              - unique
              - not_null

          - name: fetched_at
            tests:
              - not_null

          - name: source_file
            tests:
              - not_null